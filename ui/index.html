<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildberries Parser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="theme-dark">
    <div class="app-container">
        <header>
            <div class="logo">WB Parser</div>
            <div class="theme-toggle">
                <label for="theme-switch" class="switch-label">Светлая тема</label>
                <label class="switch">
                    <input type="checkbox" id="theme-switch">
                    <span class="slider round"></span>
                </label>
            </div>
        </header>

        <main>
            <section class="panel settings-panel">
                <h2>Настройки парсинга</h2>

                <div class="form-group">
                    <label>Режим парсинга</label>
                    <div class="radio-group">
                        <label><input type="radio" name="mode" value="all" checked> По категориям</label>
                        <label><input type="radio" name="mode" value="seller"> По магазину</label>
                    </div>
                </div>

                <div class="form-group" id="seller-url-group" style="display: none;">
                    <label for="seller-url">Ссылка на продавца</label>
                    <input type="text" id="seller-url" placeholder="https://www.wildberries.ru/brands/..." />
                </div>

                <div class="form-row">
                    <div class="form-group half">
                        <label for="price-min">Цена от (₽)</label>
                        <input type="number" id="price-min" value="0" />
                    </div>
                    <div class="form-group half">
                        <label for="price-max">Цена до (₽)</label>
                        <input type="number" id="price-max" value="100000" />
                    </div>
                </div>

                <div class="form-group">
                    <label for="items-count">Количество товаров (на категорию)</label>
                    <input type="number" id="items-count" value="100" />
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="merge-files" checked>
                        Объединять все категории в один файл
                    </label>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="save-images" checked>
                        Сохранение фото товара в Excel
                    </label>
                </div>

                <div class="actions">
                    <button id="btn-open-excel" class="btn success"
                        style="display: none; width: 100%; margin-bottom: 10px;">Открыть готовый Excel</button>
                    <button id="btn-start" class="btn primary">Запустить парсер</button>
                    <button id="btn-stop" class="btn danger" style="display: none;">Остановить</button>
                </div>
            </section>
            <section class="panel categories-panel">
                <div class="panel-header">
                    <h2>Категории</h2>
                    <button id="btn-refresh-cat" class="btn secondary small">Обновить список</button>
                </div>
                <div class="categories-tree" id="categories-tree">
                    <div class="loading">Загрузка категорий...</div>
                </div>
            </section>
            <section class="panel logs-panel">
                <h2>Прогресс и логи</h2>
                <div class="log-container" id="log-container">
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
